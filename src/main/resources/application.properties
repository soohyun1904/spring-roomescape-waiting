spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:database

# TossPayments (시크릿 키는 저장소에 두지 않고 환경변수로 주입한다)
toss.base-url=https://api.tosspayments.com
toss.secret-key=${TOSS_SECRET_KEY:}
toss.client-key=${TOSS_CLIENT_KEY:}

# 프론트엔드 오리진 (CORS 허용 대상)
cors.allowed-origins=http://localhost:4173,http://localhost:5173